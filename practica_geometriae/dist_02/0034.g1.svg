      <circle class="geom-point" cx="188.0" cy="78.0" r="2.6" data-ref="G" />
      <circle class="geom-point" cx="32.0" cy="44.0" r="2.6" data-ref="D" />
      <circle class="geom-point" cx="52.0" cy="12.0" r="2.6" data-ref="E" />
