  </defs>
  <style>
    .euclid-graphic {
      --geom-bg: #fafaf9;
      --geom-fg: #1c1917;
      --geom-carrier: #334155;
      --geom-circle: #0284c7;
      --geom-accent: #d97706;
      --geom-assert: #059669;
      --geom-point: #0f172a;
      --geom-label-halo: rgba(250, 250, 249, 0.92);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-bg: #141417;
        --geom-fg: #f4f4f5;
        --geom-carrier: #cbd5e1;
        --geom-circle: #38bdf8;
        --geom-accent: #fbbf24;
        --geom-assert: #34d399;
        --geom-point: #f8fafc;
        --geom-label-halo: rgba(20, 20, 23, 0.92);
      }
    }
    .euclid-graphic .svg-bg { fill: var(--geom-bg); }
    .euclid-graphic .geom-segment { fill: none; stroke: var(--geom-carrier); stroke-width: 1.65; stroke-linecap: round; }
    .euclid-graphic .geom-segment.dashed { stroke-dasharray: 4 3; opacity: 0.75; }
    .euclid-graphic .geom-circle { fill: none; stroke: var(--geom-circle); stroke-width: 1.75; }
    .euclid-graphic .geom-polygon { fill: var(--geom-circle); fill-opacity: 0.05; stroke: var(--geom-carrier); stroke-width: 1.5; stroke-linejoin: round; }
    .euclid-graphic .geom-point { fill: var(--geom-point); stroke: var(--geom-bg); stroke-width: 1.2; }
    .euclid-graphic .geom-label {
      fill: var(--geom-fg);
      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      paint-order: stroke fill;
      stroke: var(--geom-label-halo);
      stroke-width: 3px;
      stroke-linejoin: round;
      user-select: none;
    }
    .euclid-graphic .geom-num {
      fill: var(--geom-accent);
      font-size: 11px;
      font-weight: 600;
      paint-order: stroke fill;
      stroke: var(--geom-label-halo);
      stroke-width: 2.5px;
      user-select: none;
    }
  </style>
  <rect class="svg-bg" x="0" y="0" width="205" height="95" rx="4" />

