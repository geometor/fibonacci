      --icosa: #c084fc;
      --grid: #64748b;
      --share-p: #fbbf24;
      --share-q: #38bdf8;
      --pes-strip: #34d399;
      --pt-given: #e2e8f0;
      --pt-result: #38bdf8;
      --pt-mid: #2dd4bf;
      --pt-golden: #fbbf24;
    }
