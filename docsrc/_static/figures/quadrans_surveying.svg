<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 620 540" data-graphic-id="quadrans_surveying" role="img" aria-label="Distinctio VII — Optical Quadrans (Umbra Recta &amp; Umbra Versa)">
