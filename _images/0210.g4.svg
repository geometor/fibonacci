      <path class="geom-segment" d="M 12.0 318.0 L 117.0 170.0 L 222.0 22.0" data-ref="/ C A /" data-aliases="/ A C / | [ C A ] | [ A C ]" />
      <path class="geom-segment" d="M 222.0 22.0 L 222.0 170.0 L 222.0 318.0" data-ref="/ A B /" data-aliases="/ B A / | [ A B ] | [ B A ]" />
      <path class="geom-segment" d="M 222.0 318.0 L 117.0 318.0 L 12.0 318.0" data-ref="/ B C /" data-aliases="/ C B / | [ B C ] | [ C B ]" />
      <path class="geom-segment" d="M 168.0 318.0 L 168.0 210.0 L 168.0 102.0" data-ref="/ D E /" data-aliases="/ E D / | [ D E ] | [ E D ]" />
    </g>
    <g id="highlights" style="pointer-events: none;"></g>
    <g id="points">
      <circle class="geom-point" cx="222.0" cy="22.0" r="2.6" data-ref="A" />
      <circle class="geom-point" cx="222.0" cy="318.0" r="2.6" data-ref="B" />
      <circle class="geom-point" cx="12.0" cy="318.0" r="2.6" data-ref="C" />
      <circle class="geom-point" cx="168.0" cy="318.0" r="2.6" data-ref="D" />
      <circle class="geom-point" cx="168.0" cy="102.0" r="2.6" data-ref="E" />
    </g>
    <g id="labels">
      <text class="geom-label" x="220.0" y="16.0" data-ref="A">a</text>
      <text class="geom-label" x="220.0" y="330.0" data-ref="B">b</text>
      <text class="geom-label" x="4.0" y="322.0" data-ref="C">c</text>
      <text class="geom-label" x="165.0" y="330.0" data-ref="D">d</text>
      <text class="geom-label" x="159.0" y="98.0" data-ref="E">e</text>
    </g>
  </g>
