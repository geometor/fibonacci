    --cube: #059669;
    --icosa: #7c3aed;
    --grid: #94a3b8;
    --share-p: #f59e0b;
    --share-q: #0ea5e9;
    --pes-strip: #10b981;
    --pt-given: #0f172a;
    --pt-result: #0369a1;
    --pt-mid: #0f766e;
    --pt-golden: #d97706;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --svg-bg: #141417;
      --ink: #f4f4f5;
      --label-halo: rgba(20, 20, 23, 0.92);
