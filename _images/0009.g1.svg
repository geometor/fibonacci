      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      paint-order: stroke fill;
      stroke: var(--geom-label-halo);
      stroke-width: 3px;
      stroke-linejoin: round;
      user-select: none;
    }
    .euclid-graphic .geom-num {
