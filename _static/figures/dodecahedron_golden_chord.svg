      <polygon class="geom-polygon share-p-poly" points="308.49,190.37 177.92,285.23 439.06,285.23" data-ref="&lt; A B E &gt;" data-aliases="triABE | &lt; E B A &gt; | &lt; B E A &gt; | &lt; E A B &gt;" fill="none" />
      <circle class="geom-circle guide-circle" cx="439.06" cy="285.23" r="130.57" data-ref="( E M )" data-aliases="circCE | ( E C )" fill="none"><title>( E M ): y**2 + (x - 2*sqrt(3))**2 - 3 = 0</title></circle>
      <circle class="geom-circle guide-circle" cx="439.06" cy="154.66" r="130.57" data-ref="( C E )" data-aliases="circCD | ( C D )" fill="none"><title>( C E ): (x - 2*sqrt(3))**2 + (y - sqrt(3))**2 - 3 = 0</title></circle>
      <circle class="geom-circle transfer-circle" cx="177.92" cy="285.23" r="161.39" data-ref="( B D )" data-aliases="circBD | ( B G ) | ( B A ) | ( D G A )" fill="none"><title>( B D ): x**2 + y**2 - (-2*sqrt(3) + 2*sqrt(15)/5)**2 - (-sqrt(3) + sqrt(15)/5)**2 = 0</title></circle>
      <path class="geom-line carrier-line" d="M 14 285.23 L 340 285.23 L 666 285.23" data-ref="[ B G ]" data-aliases="lnBE | [ B E ] | / B E / | [ B M ] | / B M / | / B G / | [ E B ] | / E B / | [ E M ] | / E M / | [ E G ] | / E G / | [ M B ] | / M B / | [ M E ] | / M E / | [ M G ] | / M G / | [ G B ] | / G B / | [ G E ] | / G E / | [ G M ] | / G M /" fill="none"><title>[ B G ]: y = 0</title></path>
      <path class="geom-line" d="M 14 367.19 L 340 204.19 L 666 41.19" data-ref="[ B D ]" data-aliases="lnBC | [ B C ] | / B C / | / B D / | [ C B ] | / C B / | [ C D ] | / C D / | [ D B ] | / D B / | [ D C ] | / D C /" fill="none"><title>[ B D ]: -sqrt(3)*x + 2*sqrt(3)*y = 0</title></path>
      <path class="geom-segment bisector-seg" d="M 439.06 285.23 L 439.06 219.95 L 439.06 154.66" data-ref="/ E C /" data-aliases="segEC | / C E / | [ E C ] | [ C E ]" fill="none"><title>/ E C /: length = sqrt(3)</title></path>
      <path class="geom-segment golden-seg" d="M 308.49 190.37 L 243.21 237.8 L 177.92 285.23" data-ref="/ A B /" data-aliases="segAB | / B A / | [ A B ] | [ B A ]" fill="none"><title>/ A B /: length = sqrt(18 - 6*sqrt(5))</title></path>
      <path class="geom-segment golden-seg" d="M 308.49 190.37 L 373.78 237.8 L 439.06 285.23" data-ref="/ A E /" data-aliases="segAE | / E A / | [ A E ] | [ E A ]" fill="none"><title>/ A E /: length = sqrt(18 - 6*sqrt(5))</title></path>
      <path class="geom-segment golden-seg" d="M 177.92 285.23 L 258.62 285.23 L 339.32 285.23" data-ref="/ B G /" data-aliases="segBG | / G B / | [ B G ] | [ G B ]" fill="none"><title>/ B G /: length = -sqrt(3) + sqrt(15)</title></path>
      <path class="geom-segment golden-seg" d="M 177.92 285.23 L 308.49 285.23 L 439.06 285.23" data-ref="/ B G E /" fill="none" />
    </g>
