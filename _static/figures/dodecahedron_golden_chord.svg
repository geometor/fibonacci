      <circle class="geom-point given-point result-point" cx="177.92" cy="285.23" r="4.4" data-ref="B" data-latex-x="0" data-latex-y="0"><title>B = (0, 0)</title></circle>
      <circle class="geom-point given-point result-point" cx="439.06" cy="285.23" r="4.4" data-ref="E" data-latex-x="2 \sqrt{3}" data-latex-y="0"><title>E = (2*sqrt(3), 0)</title></circle>
      <circle class="geom-point result-point" cx="439.06" cy="154.66" r="4.4" data-ref="C" data-latex-x="2 \sqrt{3}" data-latex-y="\sqrt{3}"><title>C = (2*sqrt(3), sqrt(3))</title></circle>
      <circle class="geom-point result-point" cx="322.28" cy="213.05" r="4.4" data-ref="D" data-latex-x="- \frac{2 \sqrt{15}}{5} + 2 \sqrt{3}" data-latex-y="- \frac{\sqrt{15}}{5} + \sqrt{3}"><title>D = (-2*sqrt(15)/5 + 2*sqrt(3), -sqrt(15)/5 + sqrt(3))</title></circle>
      <circle class="geom-point-halo" cx="339.32" cy="285.23" r="9.2" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point result-point golden-point" cx="339.32" cy="285.23" r="5" data-ref="G" data-latex-x="- \sqrt{3} + \sqrt{15}" data-latex-y="0"><title>G = (-sqrt(3) + sqrt(15), 0)</title></circle>
      <circle class="geom-point-halo" cx="308.49" cy="190.37" r="9.2" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point result-point golden-point" cx="308.49" cy="190.37" r="5" data-ref="A" data-latex-x="\sqrt{3}" data-latex-y="\sqrt{3} \sqrt{5 - 2 \sqrt{5}}"><title>A = (sqrt(3), sqrt(3)*sqrt(5 - 2*sqrt(5)))</title></circle>
